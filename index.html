
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Служба підтримки</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f6fb;
        padding: 30px;
    }

    h1 {
        text-align: center;
        color: #243b53;
    }

    form {
        max-width: 500px;
        margin: auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px #00000015;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        margin-top: 20px;
        padding: 12px;
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>
</head>
<body>
    <h1>Форма звернення до служби підтримки</h1>

    <form id="supportForm">
        <label for="name">Ім'я:</label>
        <input type="text" id="name">
        
        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="topic">Тема звернення:</label>
        <select id="topic">
            <option value="">Оберіть тему</option>
            <option value="technical">Технічна проблема</option>
            <option value="account">Обліковий запис</option>
            <option value="other">Інше</option>
        </select>

        <label for="message">Опис проблеми:</label>
        <textarea id="message"></textarea>

        <button type="submit">Надіслати</button>
    </form>

<script>
document.getElementById("supportForm")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name")
            .value.trim();
        const email = document.getElementById("email")
            .value.trim();
        const topic = document.getElementById("topic")
            .value;
        const message = document.getElementById("message")
            .value.trim();

        if (name.length < 2) {
            alert("Ім'я має містити мінімум 2 символи.");
            return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            alert("Введіть коректну електронну адресу.");
            return;
        }

        if (topic === "" || message.length < 10) {
            alert("Оберіть тему та введіть опис від 10 символів.");
            return;
        }

        alert("Ваше звернення прийнято!");
        document.getElementById("supportForm").reset();
    });
</script>
</body>
</html>
